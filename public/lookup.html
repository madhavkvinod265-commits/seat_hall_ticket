<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Seat Lookup & Hall Ticket - ExamSeat AI</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      background: var(--gray-100);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header-bar {
      background: var(--primary-900);
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .main-lookup-container {
      flex: 1;
      padding: 2.5rem 1rem;
      max-width: 750px;
      margin: 0 auto;
      width: 100%;
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <div style="display:flex; align-items:center; gap:0.75rem; font-weight:800; font-size:1.2rem;">
      <span>🎓 ExamSeat <span style="color:var(--accent-500)">AI</span></span>
      <span style="font-size:0.75rem; font-weight:400; opacity:0.8; margin-left:8px;">Student Examination Portal</span>
    </div>
    <div>
      <a href="/login.html" class="btn btn-sm btn-secondary" style="color:var(--primary-900)">Staff / Admin Sign In</a>
    </div>
  </header>

  <div class="main-lookup-container">
    <div class="lookup-card">
      <div class="lookup-hero">
        <h2 style="font-size:1.6rem; font-weight:800;">Student Examination Seat Lookup</h2>
        <p style="font-size:0.85rem; opacity:0.9; margin-top:6px;">
          Search your seat coordinates, allocated examination hall, reporting time, and download your verified Hall Ticket.
        </p>
        <div style="display:flex; flex-wrap:wrap; gap:0.75rem; justify-content:center; margin-top:1.5rem;">
          <input type="text" id="lookup-roll-input" class="form-control" style="max-width:240px; background:#fff; text-transform:uppercase;" placeholder="Enter Roll No (e.g. CS001)">
          <select id="lookup-exam-select" class="form-control" style="max-width:260px; background:#fff;">
            <option value="">All Examinations</option>
          </select>
          <button class="btn btn-accent" onclick="LookupView.search()">Search Seat</button>
        </div>
      </div>
      <div style="padding:1.5rem;" id="lookup-results-container">
        <div style="text-align:center; padding:2.5rem; color:var(--gray-500); font-size:0.9rem;">
          Enter your College Roll Number above and click Search Seat.
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/lookup.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      LookupView.load();
    });
  </script>
</body>
</html>
