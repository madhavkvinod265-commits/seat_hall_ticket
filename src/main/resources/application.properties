# ==============================================================================
# ExamSeat AI - Spring Boot Application Configuration
# Supabase PostgreSQL Integration
# ==============================================================================

spring.application.name=ExamSeat AI

# Server Port
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# Supabase PostgreSQL Database Connectivity
# Uses environment variables with fallback defaults
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:localhost}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=${SUPABASE_DB_SSLMODE:prefer}&prepareThreshold=0
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooler configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1

# Hibernate & JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ------------------------------------------------------------------------------
# Security & JWT Configuration
# ------------------------------------------------------------------------------
examseat.jwt.secret=${APP_JWT_SECRET:examseat_ai_jwt_secret_key_minimum_32_characters_long_for_security_examseat}
examseat.jwt.expiration-ms=86400000

# Supabase Auth Integration (Optional external verification)
supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}

# ------------------------------------------------------------------------------
# File Upload Configuration (CSV imports)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------------------------------------------------------
# Institution Branding
# ------------------------------------------------------------------------------
college.name=${COLLEGE_NAME:ExamSeat Institute of Technology & Management}
college.address=${COLLEGE_ADDRESS:Knowledge Park Campus, Innovation Road, Metro City - 600001}
college.code=${COLLEGE_CODE:ESITM-2026}
